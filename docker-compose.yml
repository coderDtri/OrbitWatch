services:
  api:
    build: ./services/api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["./services/api:/app"]
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: orbitwatch
      POSTGRES_USER: orbitwatch
      POSTGRES_PASSWORD: change-me-before-deployment
    volumes: ["orbitwatch-db:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
volumes:
  orbitwatch-db:
